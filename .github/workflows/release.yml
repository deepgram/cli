name: Release to PyPI

# This workflow mirrors the local release process using the same Makefile commands
# It runs when a version tag is pushed (e.g., v0.2.0)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # The workflow follows the same steps as our local release process:
  # 1. Verify configuration (pre-build check)
  # 2. Build packages
  # 3. Verify built packages (post-build check)
  # 4. Test installation
  # 5. Publish to PyPI
  verify:
    name: Verify package configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Verify packages
        run: make verify-packages

  build:
    name: Build all packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install --system build twine

      - name: Build all packages
        run: make build

      - name: Verify built packages
        run: make verify-packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Test installation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Test installation
        run: |
          # Get absolute path to dist directory
          DIST_DIR=$(pwd)/dist
          # Install deepctl with local packages available for dependency resolution
          pip install --find-links "$DIST_DIR" dist/deepctl-*.whl
          deepctl --version

  publish:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi # Must be configured in GitHub repository settings
    permissions:
      contents: read
      id-token: write # Required for PyPI trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install publishing dependencies
        run: |
          pip install twine

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI using publish.py
        env:
          # For token-based auth (legacy)
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # Try token auth first, then fall back to trusted publishing
          if [ -n "$TWINE_PASSWORD" ]; then
            echo "Using PyPI token authentication"
            python scripts/publish.py --non-interactive --skip-existing
          else
            echo "Using PyPI trusted publishing"
            # For trusted publishing, we need to use the action
            # But we'll keep the script for local use
            python -m twine upload --non-interactive --skip-existing dist/*
          fi
