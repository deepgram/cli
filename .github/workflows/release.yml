name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Keep CI from sending telemetry from anything this workflow runs.
env:
  DEEPCTL_TELEMETRY_DISABLED: "1"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v4
        id: release
        with:
          token: ${{ github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  # The release PR's re-pin runs as two jobs so that no third-party code ever
  # runs next to a write credential:
  #   sync-release-pr  no token, no secrets. Runs uv and the lockstep check,
  #                    and hands the resulting change over as a patch artifact.
  #   push-release-pr  mints the release App token and runs no Python and no
  #                    uv: it applies the patch, checks which files it touches,
  #                    commits and pushes.
  # A release-PR job that must run after the re-pin goes here as
  # `needs: [release-please, push-release-pr]`. Benchmark gates report from the
  # PR's own workflows, not from this file.
  sync-release-pr:
    name: Re-pin lockstep versions on the release PR
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Two commits landing on main in quick succession would otherwise compute
    # two patches against the same branch. Serialize instead of cancelling.
    concurrency:
      group: sync-release-pr
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      base: ${{ steps.patch.outputs.base }}
    env:
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - name: Refuse anything but a release-please branch
        run: |
          case "${BRANCH}" in
            release-please--*) ;;
            *) echo "::error::refusing to re-pin ${BRANCH}: not a release-please branch"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
          # No cache: nothing this job writes may be restored by another job.
          enable-cache: false

      # release-please moves every lockstep version and marked pin. --fix
      # catches anything it could not (a package added since, an unmarked
      # pin), uv.lock follows the new versions (CI's `uv sync --locked` fails
      # every job without it), and the plain check proves the result. The
      # check's one dependency is installed hash-pinned.
      - name: Re-pin and regenerate uv.lock
        run: |
          set -euo pipefail
          printf '%s\n' 'packaging==26.3 --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c' > "${RUNNER_TEMP}/check-requirements.txt"
          uv venv -q "${RUNNER_TEMP}/check"
          uv pip install -q --python "${RUNNER_TEMP}/check/bin/python" --require-hashes --only-binary :all: -r "${RUNNER_TEMP}/check-requirements.txt"
          "${RUNNER_TEMP}/check/bin/python" scripts/check_dependency_floors.py --fix
          uv lock
          "${RUNNER_TEMP}/check/bin/python" scripts/check_dependency_floors.py

      - name: Write the re-pin as a patch
        id: patch
        run: |
          set -euo pipefail
          echo "base=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          git add pyproject.toml packages/*/pyproject.toml uv.lock
          # Anything else the re-pin touched means release-please and the
          # check disagree about the tree; stop rather than push half of it.
          if ! git diff --quiet; then
            echo "::error::re-pin changed files outside the pyprojects and uv.lock:"
            git diff --name-only
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "versions, pins and uv.lock already in sync"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git diff --cached --no-renames --binary > repin.patch
          git diff --cached --stat
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Hand the patch to the push job
        if: ${{ steps.patch.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: repin-patch
          path: repin.patch
          retention-days: 1

  push-release-pr:
    name: Push the re-pin with the release App
    needs: [release-please, sync-release-pr]
    if: ${{ needs.sync-release-pr.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    # The App's private key is a secret of the `release` environment, whose
    # deployment branches are limited to main: a workflow on any other branch
    # can't read it.
    environment: release
    permissions:
      contents: read
    concurrency:
      group: push-release-pr
      cancel-in-progress: false
    env:
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      BASE: ${{ needs.sync-release-pr.outputs.base }}
    steps:
      - name: Refuse anything but a release-please branch
        run: |
          case "${BRANCH}" in
            release-please--*) ;;
            *) echo "::error::refusing to push to ${BRANCH}: not a release-please branch"; exit 1 ;;
          esac

      # A token for this repository only, with contents: write and nothing
      # else. Commits pushed with an App token trigger the PR's workflows, so
      # the required checks (Lockstep versions among them) run on the release
      # PR's final head. GITHUB_TOKEN pushes trigger nothing.
      - name: Mint the release App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false

      - name: Fetch the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: repin-patch
          path: ${{ runner.temp }}/repin

      - name: Apply the patch and check what it touches
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "${BASE}" ]; then
            echo "::error::${BRANCH} moved since the patch was computed; the next release-please run re-pins it"
            exit 1
          fi
          git apply --check "${RUNNER_TEMP}/repin/repin.patch"
          git apply --index "${RUNNER_TEMP}/repin/repin.patch"
          # Only in-place edits of existing regular files, at exact paths:
          # renames are listed as a delete plus an add, so neither a rename,
          # a new file, a deletion, a symlink nor a mode change gets through.
          git diff --cached --no-renames --raw | while read -r om nm _ _ st path; do
            if [ "${om#:} ${nm} ${st}" != "100644 100644 M" ]; then
              echo "::error::${path}: only in-place edits of existing files are allowed (${om#:} ${nm} ${st})"; exit 1
            fi
            if ! [[ "${path}" =~ ^(pyproject\.toml|uv\.lock|packages/[^/]+/pyproject\.toml)$ ]]; then
              echo "::error::the patch touches ${path}"; exit 1
            fi
          done

      # The token reaches git only through GIT_CONFIG_* environment entries:
      # never in a URL, an argument or .git/config, and hooks are off.
      - name: Commit and push with the release App token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          BOT_ID=$(GH_TOKEN="${APP_TOKEN}" gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git -c core.hooksPath=/dev/null \
            -c user.name="${APP_SLUG}[bot]" \
            -c user.email="${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -m "chore: re-pin lockstep versions and regenerate uv.lock"
          AUTH=$(printf 'x-access-token:%s' "${APP_TOKEN}" | base64 -w0)
          echo "::add-mask::${AUTH}"
          GIT_CONFIG_COUNT=2 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}" \
          GIT_CONFIG_KEY_1="core.hooksPath" \
          GIT_CONFIG_VALUE_1="/dev/null" \
            git push origin "HEAD:refs/heads/${BRANCH}"

  build:
    name: Build packages
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install build twine

      - name: Build all packages
        run: make build

      - name: Verify built packages
        run: make verify-packages

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  test:
    name: Test installation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Test installation
        run: |
          DIST_DIR=$(pwd)/dist
          pip install --find-links "$DIST_DIR" dist/deepctl-*.whl
          deepctl --version

  verify-published:
    name: Verify release is installable from PyPI
    needs: [release-please, publish]
    # `pip install deepctl==X` must resolve the full dependency closure from
    # PyPI before anything advertises the release. Two real failure modes:
    # 0.2.27 published partially (root uninstallable, and pip *silently
    # backtracks* to the previous version, exit 0), and the 0.3.0 rollout
    # showed a fresh install backtracking to 0.2.26 during the CDN
    # propagation window. Poll the actual resolver, not just the JSON
    # endpoint, so mark-latest / deploy-web / brew never point at a version
    # a user cannot install.
    if: |
      needs.release-please.outputs.release_created == 'true' &&
      startsWith(needs.release-please.outputs.tag_name, 'v')
    runs-on: ubuntu-latest
    # Reads nothing and writes nothing: it installs from public PyPI. Drop the
    # workflow-level contents/pull-requests write it would otherwise inherit.
    permissions: {}
    # Belt-and-braces ceiling for a hung runner or a wedged pip, so three
    # release-advertising jobs can never sit queued behind this one
    # indefinitely. It has to clear the poll's own worst case, which is 20
    # minutes of sleeps *plus* 60 resolution attempts -- a ceiling that cuts
    # the loop short would kill the job before it prints the diagnosis below.
    timeout-minutes: 45
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # Poll with --dry-run: it stops after resolution, which is cheap and is
      # exactly what distinguishes "not propagated yet" from "broken".
      - name: Wait until pip can resolve the full release
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet --upgrade pip
          # The loop exits the moment resolution succeeds, so the ceiling only
          # costs anything when it is actually hit. Propagation is normally
          # seconds; 20 minutes is insurance, not an expected wait.
          for i in $(seq 1 60); do
            if /tmp/verify/bin/pip install --dry-run --no-cache-dir \
                "deepctl==${VERSION}" >/dev/null 2>&1; then
              echo "deepctl==${VERSION} resolves with its full closure"
              exit 0
            fi
            echo "Waiting for deepctl==${VERSION} to resolve (${i}/60)..."
            sleep 20
          done
          # Every attempt above discarded its output, so the operator would
          # otherwise get a bare error line and have to reproduce by hand.
          # Run once more with the output visible: pip's resolver says which
          # requirement it could not satisfy.
          echo "Resolution still failing. Final attempt, with output:"
          /tmp/verify/bin/pip install --dry-run --no-cache-dir "deepctl==${VERSION}" || true
          echo "::error::deepctl==${VERSION} did not resolve from PyPI after 20 minutes -- a dependency is missing or the index has not propagated. Once PyPI has propagated, use 'Re-run all jobs' on this workflow run -- re-running only this job leaves mark-latest, deploy-web and bump-brew-formula skipped. Re-running all jobs is safe: the PyPI publish step uses skip-existing."
          exit 1
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

      # Resolving is not installing. --dry-run is satisfied by PyPI metadata
      # (often via PEP 658, without fetching a single wheel), so a corrupt
      # artifact or an entry point that cannot import still passes it. The
      # build job smoke-tests `deepctl --version`, but against the local
      # dist/ artifacts -- this is the only check against what PyPI serves,
      # and it is the last gate before three jobs advertise the release.
      - name: Install for real and run the CLI
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          /tmp/verify/bin/pip install --quiet --no-cache-dir "deepctl==${VERSION}"
          /tmp/verify/bin/deepctl --version
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

  mark-latest:
    name: Mark root release as latest
    needs: [release-please, publish, verify-published]
    # Re-assert latest on the root package tag (vX.Y.Z) after PyPI publish so
    # users clicking "latest" land on a tag whose artifact is actually
    # installable. The plugin example's own release (its only other
    # component) is created with make-latest false.
    if: |
      needs.release-please.outputs.release_created == 'true' &&
      startsWith(needs.release-please.outputs.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Mark root release as latest
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --latest --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-web:
    name: Deploy web to production
    needs: [release-please, publish, verify-published]
    # Only fire on root-package releases (v0.2.4, v1.0.0, …) and only after
    # PyPI publish so cli.deepgram.com never advertises a version that isn't
    # installable yet. Sub-package tags look like deepctl-cmd-listen-v0.0.3 —
    # skip those.
    if: |
      needs.release-please.outputs.release_created == 'true' &&
      startsWith(needs.release-please.outputs.tag_name, 'v')
    uses: ./.github/workflows/web-production.yml
    secrets: inherit

  publish:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true

  bump-brew-formula:
    name: Bump Homebrew formula
    needs: [release-please, publish, verify-published]
    # Only fire on root-package releases (v0.2.4, v1.0.0, …).
    # Sub-package tags look like deepctl-cmd-listen-v0.0.3 — skip those.
    if: |
      needs.release-please.outputs.release_created == 'true' &&
      startsWith(needs.release-please.outputs.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      # No PyPI poll here: verify-published is in `needs`, and it does not
      # finish until `pip install deepctl==X` resolves its full closure and
      # the installed CLI runs. A second, weaker poll behind that gate can
      # only cost time.

      - name: Checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          repository: deepgram/homebrew-tap
          token: ${{ secrets.CLI_TAP_SYNC_PAT }}
          path: homebrew-tap

      - name: Regenerate Formula/deepgram.rb
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          python scripts/bump_brew_formula.py \
            --version "${VERSION}" \
            --formula homebrew-tap/Formula/deepgram.rb \
            --python "$(command -v python3.13)"
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}

      - name: Open bump PR against homebrew-tap
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.CLI_TAP_SYNC_PAT }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          BRANCH="bump-deepctl-${VERSION}"

          # Attribute the bump commit to whoever owns CLI_TAP_SYNC_PAT so the
          # homebrew-tap PR has a clear, linkable author. Using ${{ github.actor }}
          # would misattribute to release-please[bot] (the workflow trigger),
          # not the credential owner who actually authorized the push.
          PAT_LOGIN=$(gh api /user --jq .login)
          PAT_ID=$(gh api /user --jq .id)
          git config user.name  "${PAT_LOGIN}"
          git config user.email "${PAT_ID}+${PAT_LOGIN}@users.noreply.github.com"
          git checkout -b "${BRANCH}"

          if git diff --quiet -- Formula/deepgram.rb; then
            echo "::warning::Formula/deepgram.rb already at ${VERSION}; nothing to bump"
            exit 0
          fi

          git add Formula/deepgram.rb
          git commit -m "Bump deepctl to ${VERSION}"
          git push -u origin "${BRANCH}"

          BODY_FILE="$(mktemp)"
          cat > "${BODY_FILE}" <<EOF
          Automated bump from [deepgram/cli@${TAG_NAME}](https://github.com/deepgram/cli/releases/tag/${TAG_NAME}).

          Generated by \`scripts/bump_brew_formula.py\` against PyPI metadata for \`deepctl==${VERSION}\`. Resource blocks regenerated via \`homebrew-pypi-poet\`.

          If this PR breaks \`brew test\` or \`brew install\`, do not edit the formula directly — the file is auto-generated. Fix the template in [\`scripts/templates/deepgram.rb.template\`](https://github.com/deepgram/cli/blob/main/scripts/templates/deepgram.rb.template) and let the next release regenerate it. For emergency fixes, run \`scripts/bump_brew_formula.py\` locally and push directly.
          EOF

          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "Bump deepctl to ${VERSION}" \
            --body-file "${BODY_FILE}"
