name: Test

on:
  push:
  pull_request:

# Every job here only reads the repository: no job comments, labels, or
# pushes. Least privilege rather than whatever the repo default happens to be.
permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A full run takes under 10 minutes; a deadlocked test must fail the
    # job, not hold a runner until the 6-hour Actions limit.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        run: uv sync --group testing --locked

      - name: Run tests
        run: |
          uv run pytest tests packages/deepctl-core/tests packages/deepctl-shared-utils/tests packages/deepctl-telemetry/tests packages/deepctl-cmd-api/tests packages/deepctl-cmd-login/tests packages/deepctl-cmd-projects/tests packages/deepctl-cmd-transcribe/tests packages/deepctl-cmd-usage/tests packages/deepctl-cmd-debug/tests packages/deepctl-cmd-debug-audio/tests packages/deepctl-cmd-debug-browser/tests packages/deepctl-cmd-debug-network/tests packages/deepctl-cmd-debug-toolkit/tests packages/deepctl-cmd-debug-probe/tests packages/deepctl-cmd-ffprobe/tests packages/deepctl-cmd-mcp/tests packages/deepctl-cmd-update/tests packages/deepctl-cmd-plugin/tests packages/deepctl-cmd-skills/tests packages/deepctl-cmd-init/tests packages/deepctl-cmd-models/tests packages/deepctl-cmd-speak/tests packages/deepctl-cmd-keys/tests packages/deepctl-cmd-read/tests packages/deepctl-cmd-listen/tests packages/deepctl-cmd-requests/tests packages/deepctl-cmd-billing/tests packages/deepctl-cmd-members/tests packages/deepctl-cmd-completion/tests packages/deepctl-plugin-example/tests --cov --cov-report=term-missing -v --timeout=300

      # Outside pytest, so conftest.py's telemetry opt-out doesn't apply.
      - name: Test CLI installation
        env:
          DEEPCTL_TELEMETRY_DISABLED: "1"
          DEEPCTL_TELEMETRY_DSN: "http://k@127.0.0.1:9/1"
        run: |
          uv run python -c "from deepctl.main import main; print('Import successful')"
          uv run deepctl --version

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install dependencies
        run: uv sync --group testing --locked

      - name: Check formatting
        run: uv run ruff format --check src/ packages/*/src scripts/

      - name: Lint
        run: uv run ruff check src/ packages/*/src scripts/

      - name: Type check
        run: uv run mypy src/ packages/*/src scripts/

  lockstep:
    name: Lockstep versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      # Every first-party package ships at the root's version: every version,
      # every first-party pin `==` it, every package's `deepctl==` back-edge,
      # and root lists every package. A mismatch lets pip pair packages from
      # two releases. The release PR has to pass it like any other.
      # See scripts/check_dependency_floors.py.
      - name: Check lockstep versions and pins
        run: make floors-check

  build-test:
    name: Test Build Process
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install build dependencies
        run: uv pip install --system build

      - name: Test build process
        run: make build

      - name: Verify packages
        run: make verify-packages

  lowest-direct:
    name: Lowest direct dependencies / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.6"

      - name: Build every package
        run: uv build --all-packages --wheel --out-dir dist

      # One environment: the whole lockstep closure with every third-party
      # dependency at the lowest version the 30 pyprojects together allow.
      # The CLI's --help tree and the unit tests run in it; floors that sit
      # below what the closure resolves are listed in the log.
      - name: Install the closure at its floors, then run the CLI and unit tests
        env:
          DEEPCTL_TELEMETRY_DISABLED: "1"
          DEEPCTL_TELEMETRY_DSN: "http://k@127.0.0.1:9/1"
        run: tests/upgrade/lowest_direct.sh dist python

  # The launcher's unit tests on every Node version package.json's engines
  # field admits. Linux only: the cross-OS job below covers platforms.
  launcher-node:
    name: npm launcher unit tests / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.0.0 is the engines floor itself.
        node: ["20.0.0", "20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # Unquoted: Node 20 does not expand --test globs itself, bash does.
      - name: Unit tests
        run: node --test npm/test/*.test.js

  launcher:
    name: npm launcher / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      # A glob, not the directory: Node 22+ treats --test arguments as file
      # patterns, and Node expands it itself where the shell does not.
      - name: Unit tests
        run: node --test "npm/test/*.test.js"

      # npm/LICENSE is what npmjs.com and the tarball show; it must not drift
      # from the repository's.
      - name: npm/LICENSE matches LICENSE
        run: cmp LICENSE npm/LICENSE

      # Regression: the launcher once made the stdin it hands to deepctl
      # non-blocking, so a reader that had to wait (an MCP host, `ffmpeg |
      # dg listen`) failed. A stand-in deepctl checks fds 0-2 and reads input
      # that arrives a second late.
      - name: stdin stays blocking for deepctl
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          FAKE="$(mktemp -d)"
          cat > "${FAKE}/deepctl" <<'PY'
          #!/usr/bin/env python3
          import fcntl, os, sys
          flags = [bool(fcntl.fcntl(fd, fcntl.F_GETFL) & os.O_NONBLOCK) for fd in (0, 1, 2)]
          print("nonblock=%s read=%r" % (flags, sys.stdin.read()))
          PY
          chmod +x "${FAKE}/deepctl"
          OUT="$( (sleep 1; echo hello) | PATH="${FAKE}:${PATH}" DEEPCTL_NPM_RUNNER=path node npm/bin/dg.js)"
          echo "${OUT}"
          [ "${OUT}" = "nonblock=[False, False, False] read='hello\n'" ]

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.6"

      # npm/package.json is already bumped on a release PR, before PyPI has
      # that version, so run the launcher against the newest deepctl that
      # PyPI actually serves. This checks the launcher, not the release.
      - name: Smoke test against the latest deepctl on PyPI
        run: |
          set -euo pipefail
          LATEST="$(node -e 'fetch("https://pypi.org/pypi/deepctl/json").then(r => r.json()).then(d => console.log(d.info.version))')"
          echo "deepctl on PyPI: ${LATEST}"
          echo "latest=${LATEST}" >> "$GITHUB_ENV"
          OUT="$(DEEPCTL_NPM_PYPI_SPEC="deepctl==${LATEST}" node npm/bin/dg.js --version)"
          echo "${OUT}"
          printf '%s' "${OUT}" | grep -qF "${LATEST}"

      # The fallback for machines without uv: find Python, build a private
      # venv, run from it. Windows exercises Scripts\deepctl.exe and the py
      # launcher here.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Smoke test the venv strategy
        run: |
          set -euo pipefail
          # tr: Python on Windows ends lines with CRLF.
          OUT="$(DEEPCTL_NPM_RUNNER=venv DEEPCTL_NPM_PYPI_SPEC="deepctl==${latest}" node npm/bin/dg.js --version | tr -d '\r')"
          printf 'stdout: %s\n' "${OUT}"
          # Exactly the version line: setup chatter must stay on stderr.
          [ "${OUT}" = "deepctl, version ${latest}" ]
          # Windows never reuses a venv: the one-run venv must be gone.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            LEFT="$(ls -A "$(cygpath "${LOCALAPPDATA}")/deepgram-cli/venvs")"
            [ -z "${LEFT}" ] || { echo "::error::one-run venv left behind: ${LEFT}"; exit 1; }
          fi

  # The release path, end to end, without PyPI: build this commit's
  # packages, serve them and their locked dependencies from a local index
  # (simple pages plus the JSON API write_requirements.py reads), write the
  # hash-locked requirements file against it, and run the launcher through
  # uv and through the pip fallback. The `launcher` job's smoke tests use
  # the unhashed DEEPCTL_NPM_PYPI_SPEC override; this one does not.
  launcher-hashed:
    name: npm launcher hash-locked install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    env:
      DEEPCTL_TELEMETRY_DISABLED: "1"
      DEEPCTL_TELEMETRY_DSN: "http://k@127.0.0.1:9/1"
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.13.6"

      # One step: the index server only lives as long as the step's shell.
      - name: Install through the launcher from a local index
        run: |
          set -euo pipefail
          uv build --all-packages -q -o dist
          uv export --frozen --no-dev --no-emit-workspace --no-header --no-annotate > third.txt
          # Wheels for every Python the launcher may pick (it prefers the
          # newest supported one, and runners have several installed).
          for v in 3.12 3.13 3.14; do
            python -m pip download -q --disable-pip-version-check --only-binary :all: --no-deps --require-hashes --python-version "${v}" -r third.txt -d wheels
          done
          python npm/scripts/local_index.py --out idx dist wheels
          python -m http.server -b 127.0.0.1 -d idx 8765 > /dev/null 2>&1 &
          SERVER=$!
          trap 'kill "${SERVER}"' EXIT
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8765/simple/ > /dev/null && break; sleep 1; done
          python npm/scripts/write_requirements.py --index-url http://127.0.0.1:8765 --dist dist
          VERSION="$(node -p 'require("./npm/package.json").version')"
          export UV_INDEX_URL=http://127.0.0.1:8765/simple PIP_INDEX_URL=http://127.0.0.1:8765/simple
          # Windows never reuses a uv cache: plant one where earlier versions
          # kept it, and check below that uv neither read nor wrote it.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            PLANTED="$(cygpath "${LOCALAPPDATA}")/deepgram-cli/uv-cache"
            mkdir -p "${PLANTED}"
            echo planted > "${PLANTED}/marker"
          fi
          for runner in uvx venv; do
            # A fresh HOME per runner, so the venv run cannot reuse the venv
            # the uv run cached (macOS keeps it under ~/Library/Caches).
            # tr: Python on Windows ends lines with CRLF.
            mkdir -p "${RUNNER_TEMP}/home-${runner}"
            OUT="$(HOME="${RUNNER_TEMP}/home-${runner}" DEEPCTL_NPM_RUNNER="${runner}" node npm/bin/dg.js --version | tr -d '\r')"
            printf '%s: %s\n' "${runner}" "${OUT}"
            [ "${OUT}" = "deepctl, version ${VERSION}" ]
          done
          # Windows never reuses a venv: the one-run venvs must be gone.
          if [ "${RUNNER_OS}" = "Windows" ]; then
            LEFT="$(ls -A "$(cygpath "${LOCALAPPDATA}")/deepgram-cli/venvs")"
            [ -z "${LEFT}" ] || { echo "::error::one-run venv left behind: ${LEFT}"; exit 1; }
            CACHED="$(ls -A "${PLANTED}")"
            [ "${CACHED}" = "marker" ] || { echo "::error::the uv cache in ${PLANTED} was used: ${CACHED}"; exit 1; }
          fi

  # Single rollup so branch protection needs exactly one required check.
  # Requiring the matrix contexts directly means editing repo settings every
  # time a Python version or OS is added or dropped, and a required context
  # that stops reporting blocks every merge until someone notices.
  #
  # `if: always()` is load-bearing: without it this job is *skipped* when a
  # prerequisite fails, and a skipped required check never reports failure --
  # it just stalls. Run always, then fail on anything that is not success, so
  # cancelled and skipped prerequisites are failures here too.
  all-checks:
    name: All checks
    needs: [test, lint, lockstep, lowest-direct, build-test, launcher-node, launcher, launcher-hashed]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report prerequisite results
        run: |
          echo "test:       ${{ needs.test.result }}"
          echo "lint:       ${{ needs.lint.result }}"
          echo "lockstep:   ${{ needs.lockstep.result }}"
          echo "lowest-direct: ${{ needs.lowest-direct.result }}"
          echo "build-test: ${{ needs.build-test.result }}"
          echo "launcher-node: ${{ needs.launcher-node.result }}"
          echo "launcher:   ${{ needs.launcher.result }}"
          echo "launcher-hashed: ${{ needs.launcher-hashed.result }}"

      - name: Fail unless every prerequisite succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::One or more required jobs did not succeed"
          exit 1
