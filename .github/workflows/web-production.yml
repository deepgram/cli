name: Deploy web — production

on:
  # Called from release.yml after a root-package release (v*).
  # Using workflow_call avoids the GitHub Actions limitation where
  # GITHUB_TOKEN-created releases do not trigger release: published
  # in other workflows.
  workflow_call:
  workflow_dispatch:

# Only one production deploy at a time; never cancel in-progress
concurrency:
  group: web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to production
    runs-on: ubuntu-latest
    environment:
      name: web-production
      url: https://cli.deepgram.com

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          SITE_URL: https://cli.deepgram.com

      - name: Deploy to Netlify (production)
        run: npx netlify-cli deploy --dir dist --prod --no-build
        working-directory: web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
