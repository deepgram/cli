name: Deploy web — staging

on:
  push:
    branches: [main]
    paths:
      - web/**
  workflow_dispatch:

# Cancel any in-progress staging deploy for the same ref
concurrency:
  group: web-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to staging
    runs-on: ubuntu-latest
    environment:
      name: web-staging
      url: ${{ steps.deploy.outputs.deploy-url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          SITE_URL: ${{ vars.STAGING_SITE_URL || 'https://cli.staging.deepgram.com' }}

      - name: Deploy to Netlify (staging)
        id: deploy
        run: |
          URL=$(npx netlify-cli deploy \
            --dir dist \
            --alias staging \
            --json \
            2>/dev/null | jq -r '.deploy_url')
          echo "deploy-url=$URL" >> "$GITHUB_OUTPUT"
        working-directory: web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
