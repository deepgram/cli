[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepctl-cmd-completion"
version = "0.4.1" # x-release-please-version
description = "Shell completion command for deepctl"
readme = "README.md"
license = "MIT"
authors = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
maintainers = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["deepgram", "cli", "completion", "shell"]
requires-python = ">=3.10"
dependencies = [
    "deepctl==0.4.1", # x-release-please-version
    "deepctl-core==0.4.1", # x-release-please-version
    "click>=8.2.0,<9",
    "rich>=13.0.0,<16",
    "pydantic>=2.0.0,<3",
]

[project.scripts]
# Internal commands not meant to be called directly

[project.entry-points."deepctl.commands"]
completion = "deepctl_cmd_completion.command:CompletionCommand"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepctl_cmd_completion*"]

[tool.uv.sources]
deepctl = { workspace = true }
deepctl-core = { workspace = true }
