[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepctl-cmd-debug-audio"
version = "0.1.0"
description = "Audio debug subcommand for deepctl"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Deepgram", email = "support@deepgram.com" }]
maintainers = [{ name = "Deepgram", email = "support@deepgram.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["deepgram", "cli", "debug", "audio", "diagnostics"]
requires-python = ">=3.8.1"
dependencies = [
    "deepctl-core",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "ffmpeg-python>=0.2.0",
]

[project.scripts]
# Internal commands not meant to be called directly

[project.entry-points."deepctl.subcommands.debug"]
audio = "deepctl_cmd_debug_audio.command:AudioCommand"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepctl_cmd_debug_audio*"]
