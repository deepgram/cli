[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepctl-cmd-debug-network"
version = "0.4.1" # x-release-please-version
description = "Network debug subcommand for deepctl"
readme = "README.md"
license = "MIT"
authors = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
maintainers = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["deepgram", "cli", "debug", "network", "diagnostics"]
requires-python = ">=3.10"
dependencies = [
    "deepctl==0.4.1", # x-release-please-version
    "deepctl-core==0.4.1", # x-release-please-version
    "click>=8.2.0,<9",
    "rich>=13.0.0,<16",
    "pydantic>=2.0.0,<3",
    "httpx>=0.24.0,<1",
    "requests>=2.31,<3.0",
]

[project.scripts]
# Internal commands not meant to be called directly

[project.entry-points."deepctl.subcommands.debug"]
network = "deepctl_cmd_debug_network.command:NetworkCommand"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepctl_cmd_debug_network*"]

[tool.uv.sources]
deepctl = { workspace = true }
deepctl-core = { workspace = true }
