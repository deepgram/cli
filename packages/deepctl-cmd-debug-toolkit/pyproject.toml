[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepctl-cmd-debug-toolkit"
version = "0.5.0" # x-release-please-version
description = "Toolkit subcommand for dg debug — runs field support scripts from deepgram/support-toolkit"
readme = "README.md"
authors = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "deepctl==0.5.0", # x-release-please-version
    "deepctl-core==0.5.0", # x-release-please-version
    "httpx>=0.27.0,<1",
    "pydantic>=2.10.1,<3",
    "platformdirs>=4.0.0,<5",
    "rich>=13.9.4,<16",
    "click>=8.2.0,<9",
]

[project.entry-points."deepctl.subcommands.debug"]
toolkit = "deepctl_cmd_debug_toolkit.command:ToolkitCommand"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-mock>=3.14.0",
    "mypy>=1.13.0",
    "ruff>=0.8.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepctl_cmd_debug_toolkit*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "Q"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.uv.sources]
deepctl = { workspace = true }
deepctl-core = { workspace = true }
