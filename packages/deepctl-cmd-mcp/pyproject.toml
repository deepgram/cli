[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepctl-cmd-mcp"
version = "0.1.16" # x-release-please-version
description = "MCP server for deepctl: Deepgram documentation search over stdio"
readme = "README.md"
authors = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "deepctl-core>=0.1.10",
    # The stdio proxy lives in deepctl_cmd_mcp.proxy (vendored from
    # deepgram-mcp), so installing deepctl adds no deepgram-mcp console
    # script. 1.22 is the oldest mcp that runs dg mcp with current pydantic
    # (1.19-1.21 fail on import with pydantic 2.14), passes a returned
    # CallToolResult through whole and takes httpx_client_factory, which
    # dg mcp uses to refuse redirects. mcp 2.0 removed streamablehttp_client.
    "mcp>=1.22.0,<2.0.0",
    "rich>=13.9.4",
    "click>=8.1.7",
    "pydantic>=2.10.1",
]

[project.entry-points."deepctl.commands"]
mcp = "deepctl_cmd_mcp.command:McpCommand"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.13.0",
    "ruff>=0.8.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepctl_cmd_mcp*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "Q"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
