[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepctl-cmd-transcribe"
version = "0.4.1" # x-release-please-version
description = "Transcribe command for deepctl"
readme = "README.md"
license = "MIT"
authors = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
maintainers = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["deepgram", "cli", "transcribe", "speech", "audio"]
requires-python = ">=3.10"
dependencies = [
    "deepctl==0.4.1", # x-release-please-version
    "deepctl-core==0.4.1", # x-release-please-version
    "deepctl-cmd-listen==0.4.1", # x-release-please-version
]

[project.scripts]
# Internal commands not meant to be called directly

[project.entry-points."deepctl.commands"]
transcribe = "deepctl_cmd_transcribe.command:TranscribeCommand"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepctl_cmd_transcribe*"]

[tool.uv.sources]
deepctl = { workspace = true }
deepctl-cmd-listen = { workspace = true }
deepctl-core = { workspace = true }
