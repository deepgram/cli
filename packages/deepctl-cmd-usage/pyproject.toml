[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepctl-cmd-usage"
version = "0.4.1" # x-release-please-version
description = "Usage command for deepctl"
readme = "README.md"
license = "MIT"
authors = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
maintainers = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["deepgram", "cli", "usage", "statistics"]
requires-python = ">=3.10"
dependencies = [
    "deepctl==0.4.1", # x-release-please-version
    "deepctl-core==0.4.1", # x-release-please-version
    "deepctl-shared-utils==0.4.1", # x-release-please-version
    "click>=8.2.0,<9",
    "rich>=13.0.0,<16",
    "deepgram-sdk>=7.7.0,<8",
    "pydantic>=2.0.0,<3",
]

[project.scripts]
# Internal commands not meant to be called directly

[project.entry-points."deepctl.commands"]
usage = "deepctl_cmd_usage.command:UsageCommand"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepctl_cmd_usage*"]

[tool.uv.sources]
deepctl = { workspace = true }
deepctl-core = { workspace = true }
deepctl-shared-utils = { workspace = true }
