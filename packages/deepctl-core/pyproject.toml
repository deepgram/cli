[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepctl-core"
version = "0.5.0" # x-release-please-version
description = "Core components for deepctl"
readme = "README.md"
license = "MIT"
authors = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
maintainers = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["deepgram", "core", "auth", "config", "client"]
requires-python = ">=3.10"
dependencies = [
    "deepctl==0.5.0", # x-release-please-version
    "click>=8.2.0,<9",
    "deepgram-sdk>=7.7.0,<8",
    "pydantic>=2.0.0,<3",
    "rich>=13.0.0,<16",
    "httpx>=0.24.0,<1",
    "pyjwt>=2.8.0",
    "keyring>=24.0.0,<26",
    "pyyaml>=6.0.0",
    "platformdirs>=3.0.0,<5",
    "packaging>=21.0",
    "websockets>=13.1,<18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepctl_core*"]

[tool.uv.sources]
deepctl = { workspace = true }
