[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepctl-telemetry"
version = "0.4.1" # x-release-please-version
description = "Error reporting for deepctl; this version sends no telemetry"
readme = "README.md"
license = "MIT"
authors = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
maintainers = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["deepgram", "cli", "telemetry", "sentry"]
requires-python = ">=3.10"
dependencies = [
    "deepctl==0.4.1", # x-release-please-version
    "deepctl-core==0.4.1", # x-release-please-version
    "sentry-sdk>=2.35.0,<3",
    "click>=8.2.0,<9",
    "rich>=13.0.0,<16",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepctl_telemetry*"]

[tool.uv.sources]
deepctl-core = { workspace = true }
deepctl = { workspace = true }
