[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepctl"
version = "0.4.1" # x-release-please-version
description = "Official Deepgram CLI for speech recognition and audio intelligence"
readme = "README.md"
license = "MIT"
authors = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
maintainers = [{ name = "Deepgram", email = "devrel@deepgram.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "deepgram",
    "speech",
    "recognition",
    "transcription",
    "audio",
    "cli",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.2.0,<9",
    "deepgram-sdk>=7.7.0,<8",
    "deepctl-core==0.4.1", # x-release-please-version
    "deepctl-cmd-login==0.4.1", # x-release-please-version
    "deepctl-cmd-projects==0.4.1", # x-release-please-version
    "deepctl-cmd-transcribe==0.4.1", # x-release-please-version
    "deepctl-cmd-usage==0.4.1", # x-release-please-version
    "deepctl-cmd-mcp==0.4.1", # x-release-please-version
    "deepctl-cmd-api==0.4.1", # x-release-please-version
    "deepctl-cmd-debug==0.4.1", # x-release-please-version
    "deepctl-cmd-debug-browser==0.4.1", # x-release-please-version
    "deepctl-cmd-debug-network==0.4.1", # x-release-please-version
    "deepctl-cmd-debug-audio==0.4.1", # x-release-please-version
    "deepctl-cmd-debug-probe==0.4.1", # x-release-please-version
    "deepctl-cmd-debug-toolkit==0.4.1", # x-release-please-version
    "deepctl-cmd-ffprobe==0.4.1", # x-release-please-version
    "deepctl-cmd-update==0.4.1", # x-release-please-version
    "deepctl-cmd-plugin==0.4.1", # x-release-please-version
    "deepctl-cmd-skills==0.4.1", # x-release-please-version
    "deepctl-cmd-init==0.4.1", # x-release-please-version
    "deepctl-cmd-models==0.4.1", # x-release-please-version
    "deepctl-cmd-speak==0.4.1", # x-release-please-version
    "deepctl-cmd-keys==0.4.1", # x-release-please-version
    "deepctl-cmd-read==0.4.1", # x-release-please-version
    "deepctl-cmd-listen==0.4.1", # x-release-please-version
    "deepctl-cmd-requests==0.4.1", # x-release-please-version
    "deepctl-cmd-billing==0.4.1", # x-release-please-version
    "deepctl-cmd-members==0.4.1", # x-release-please-version
    "deepctl-cmd-completion==0.4.1", # x-release-please-version
    "deepctl-shared-utils==0.4.1", # x-release-please-version
    "deepctl-telemetry==0.4.1", # x-release-please-version
    "pydantic>=2.0.0,<3",
    "rich>=13.0.0,<16",
    "httpx>=0.24.0,<1",
    "requests>=2.31,<3.0",
    "pyjwt>=2.8.0",
    "keyring>=24.0.0,<26",
    "pyyaml>=6.0.0",
    "platformdirs>=3.0.0,<5",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.3.1,<3",
    "responses>=0.23.0",
    # tests/unit/test_manifest.py validates the command manifest against
    # docs/contracts/*.schema.json.
    "jsonschema>=4.18.0",
    # Code Quality
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "packaging>=23.0",
    # Type Stubs
    "types-PyYAML>=6.0.0",
    "types-requests>=2.31.0",
    # Development Tools
    "pre-commit>=3.0.0",
    # Publishing
    # twine <7 rejects Metadata-Version 2.5 (emitted by hatchling), which
    # silently broke the 0.2.27 publish. Keep local verify == what publishes.
    "twine>=7.0.0",
    "build>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/deepgram/cli"
Documentation = "https://developers.deepgram.com/docs/cli"
Repository = "https://github.com/deepgram/cli"
"Bug Tracker" = "https://github.com/deepgram/cli/issues"
"Community" = "https://discord.gg/deepgram"

[project.scripts]
deepctl = "deepctl.main:main"
deepgram = "deepctl.main:main"
dg = "deepctl.main:main"

# Most commands come from the command packages; the help topics ship here.
[project.entry-points."deepctl.commands"]
help = "deepctl.help_topics:HelpCommand"

[project.entry-points."deepctl.subcommands.help"]
agent-mode = "deepctl.help_topics.agent_mode:AgentModeCommand"

[tool.setuptools]
package-dir = { "" = "src" }
# build_py also assembles deepctl/_manifest.json from the command
# fragments in src/deepctl/_manifest.d/ (deepctl/_manifest_build.py).
cmdclass = { build_py = "deepctl._manifest_build.BuildPy" }

[tool.setuptools.exclude-package-data]
# The fragments are build input; wheels carry the assembled _manifest.json.
deepctl = ["_manifest.d/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepctl*"]

[tool.mypy]
python_version = "3.10"
strict = true
files = "src/,packages/*/src,scripts/"

[[tool.mypy.overrides]]
module = ["tomli"]
# The pre-3.11 fallback for tomllib in scripts/. It is not installed, and
# mypy checks that branch because python_version is pinned to 3.10.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deepctl_cmd_mcp.*"
# MCP SDK type stubs are incomplete (decorators, transport parameters)
disable_error_code = ["call-arg", "no-untyped-call", "no-untyped-def", "untyped-decorator", "misc"]

[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "sounddevice.*",
]
# The microphone dependency (sounddevice) ships without type stubs. Skip
# analyzing it; usages fall back to Any.
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/*/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# pythonpath is the correct option name (not python_path)
pythonpath = ["."]
# Add package directories to sys.path
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "requires_auth: Tests that require authentication",
    "requires_network: Tests that require network access",
    "benchmark: Benchmark tests",
]

[tool.uv]
# Optional: uv-specific configuration
# Uncomment and configure as needed

# Set the Python version constraint
# python = ">=3.10"

# Package index configuration
# index-url = "https://pypi.org/simple"
# extra-index-url = []

# Virtual environment configuration
# venv = ".venv"

# Development dependencies (can also be specified here)
# dev-dependencies = [
#     "pytest>=7.0.0",
#     "ruff>=0.8.0",
#     "mypy>=1.0.0",
# ]

[tool.uv.sources]
# Workspace dependencies
deepctl-core = { workspace = true }
deepctl-cmd-api = { workspace = true }
deepctl-cmd-login = { workspace = true }
deepctl-cmd-projects = { workspace = true }
deepctl-cmd-transcribe = { workspace = true }
deepctl-cmd-usage = { workspace = true }
deepctl-cmd-mcp = { workspace = true }
deepctl-cmd-debug = { workspace = true }
deepctl-cmd-debug-browser = { workspace = true }
deepctl-cmd-debug-network = { workspace = true }
deepctl-cmd-debug-audio = { workspace = true }
deepctl-cmd-debug-toolkit = { workspace = true }
deepctl-cmd-debug-probe = { workspace = true }
deepctl-cmd-ffprobe = { workspace = true }
deepctl-cmd-update = { workspace = true }
deepctl-cmd-plugin = { workspace = true }
deepctl-cmd-skills = { workspace = true }
deepctl-cmd-init = { workspace = true }
deepctl-cmd-models = { workspace = true }
deepctl-cmd-speak = { workspace = true }
deepctl-cmd-keys = { workspace = true }
deepctl-cmd-read = { workspace = true }
deepctl-cmd-listen = { workspace = true }
deepctl-cmd-requests = { workspace = true }
deepctl-cmd-billing = { workspace = true }
deepctl-cmd-members = { workspace = true }
deepctl-cmd-completion = { workspace = true }
deepctl-shared-utils = { workspace = true }
deepctl-telemetry = { workspace = true }
deepctl-plugin-example = { workspace = true }

[tool.uv.workspace]
# Workspace configuration
members = ["packages/*"]

[dependency-groups]
testing = [
    "pytest>=7.0.0",
    # scripts/check_dependency_floors.py reads pyproject files; on 3.10 it
    # falls back to tomli, and tests/unit/test_dependency_floors.py drives
    # the real script on every version in the CI matrix.
    "tomli>=2.0; python_version < '3.11'",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.3.1,<3",
    "responses>=0.23.0",
    # tests/unit/test_manifest.py validates the command manifest against
    # docs/contracts/*.schema.json.
    "jsonschema>=4.18.0",
    "deepctl-plugin-example",
]
dev = [
    { include-group = "testing" },
    # Code Quality
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    # PEP 440 comparisons in scripts/check_dependency_floors.py. Declared
    # rather than leaned on as a transitive of build/twine.
    "packaging>=23.0",
    # Type Stubs
    "types-pyyaml>=6.0.12.20250516",
    "types-requests>=2.32.4.20250611",
    # Development Tools
    "pre-commit>=3.0.0",
    # Publishing
    # twine <7 rejects Metadata-Version 2.5 (emitted by hatchling), which
    # silently broke the 0.2.27 publish. Keep local verify == what publishes.
    "twine>=7.0.0",
    "build>=0.10.0",
]

[tool.ruff]
# Exclude common directories
exclude = [
    ".git",
    ".mypy_cache",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "*.egg-info",
]

line-length = 88

# Target Python 3.10+
target-version = "py310"

[tool.ruff.lint]
# Enable multiple rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in argument defaults
    "B904",   # raise from exception
    "SIM105", # try-except-pass
    "RUF001", # ambiguous unicode characters (info symbol)
    "ARG001", # unused function arguments (often needed for interfaces)
    "E721",   # type comparison (sometimes needed for Pydantic)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Ignore unused imports in __init__ files
"**/__init__.py" = ["F401"]
# Ignore imports in tests
"**/test_*.py" = ["F401", "ARG"]
# Ignore unused arguments in command handler methods
"**/command.py" = ["ARG002", "ARG005", "RUF012"]
"**/commands.py" = ["ARG002", "ARG005", "RUF012"]
"**/base_command.py" = ["ARG002"]
"**/strategies.py" = ["ARG002"]
# The root project (deepctl) is implicitly a member since it contains [project]
