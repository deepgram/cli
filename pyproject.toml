[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepctl"
version = "0.1.0"
description = "Official Deepgram CLI for speech recognition and audio intelligence"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Deepgram", email = "support@deepgram.com" }]
maintainers = [{ name = "Deepgram", email = "support@deepgram.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "deepgram",
    "speech",
    "recognition",
    "transcription",
    "audio",
    "cli",
]
requires-python = ">=3.8.1"
dependencies = [
    "click>=8.0.0",
    "deepgram-sdk>=3.0.0",
    "deepctl-core",           # Core components moved to separate package
    "deepctl-cmd-login",      # Login command package
    "deepctl-cmd-projects",   # Projects command package
    "deepctl-cmd-transcribe", # Transcribe command package
    "deepctl-cmd-usage",      # Usage command package
    "deepctl-shared-utils",   # Shared utilities
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "pyjwt>=2.8.0",
    "keyring>=24.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.9.0",
    "platformdirs>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "twine>=4.0.0",
    "build>=0.10.0",

]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "responses>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/deepgram/cli"
Documentation = "https://developers.deepgram.com/docs/cli"
Repository = "https://github.com/deepgram/cli"
"Bug Tracker" = "https://github.com/deepgram/cli/issues"
"Community" = "https://discord.gg/deepgram"

[project.scripts]
deepctl = "deepctl.main:main"
deepgram = "deepctl.main:main"
dg = "deepctl.main:main"

# Entry points are now provided by individual command packages
# [project.entry-points."deepctl.commands"]
# transcribe = "deepctl.commands.transcribe:TranscribeCommand"
# projects = "deepctl.commands.projects:ProjectsCommand"
# usage = "deepctl.commands.usage:UsageCommand"
# login = "deepctl.commands.login:LoginCommand"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepctl*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=deepctl --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/deepctl"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.uv]
# Optional: uv-specific configuration
# Uncomment and configure as needed

# Set the Python version constraint
# python = ">=3.8"

# Package index configuration
# index-url = "https://pypi.org/simple"
# extra-index-url = []

# Virtual environment configuration
# venv = ".venv"

# Development dependencies (can also be specified here)
# dev-dependencies = [
#     "pytest>=7.0.0",
#     "black>=23.0.0",
#     "mypy>=1.0.0",
# ]

[tool.uv.sources]
# Workspace dependencies
deepctl-core = { workspace = true }
deepctl-cmd-login = { workspace = true }
deepctl-cmd-projects = { workspace = true }
deepctl-cmd-transcribe = { workspace = true }
deepctl-cmd-usage = { workspace = true }
deepctl-shared-utils = { workspace = true }

[tool.uv.workspace]
# Workspace configuration
members = ["packages/*"]
# The root project (deepctl) is implicitly a member since it contains [project]
