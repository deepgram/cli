[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths - include all package test directories
testpaths = 
    tests
    packages/deepctl-core/tests
    packages/deepctl-cmd-login/tests
    packages/deepctl-cmd-projects/tests
    packages/deepctl-cmd-transcribe/tests
    packages/deepctl-cmd-usage/tests
    packages/deepctl-shared-utils/tests

# Coverage options
addopts = --import-mode=importlib --cov=deepctl --cov=deepctl_core --cov=deepctl_cmd_login --cov=deepctl_cmd_projects --cov=deepctl_cmd_transcribe --cov=deepctl_cmd_usage --cov=deepctl_shared_utils --cov-report=term-missing --cov-report=html --cov-config=pytest.ini -v
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_auth: Tests that require authentication
    requires_network: Tests that require network access
    parametrize: Parametrized tests
    benchmark: Performance benchmark tests
    
# Test output
console_output_style = progress

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S 

[coverage:run]
source = 
    src/deepctl
    packages/deepctl-core/src/deepctl_core
    packages/deepctl-cmd-login/src/deepctl_cmd_login
    packages/deepctl-cmd-projects/src/deepctl_cmd_projects
    packages/deepctl-cmd-transcribe/src/deepctl_cmd_transcribe
    packages/deepctl-cmd-usage/src/deepctl_cmd_usage
    packages/deepctl-shared-utils/src/deepctl_shared_utils
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */.venv/*
    */.pytest_cache/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    except ImportError:

[coverage:html]
directory = htmlcov 