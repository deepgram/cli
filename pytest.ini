[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Coverage options
addopts = --cov=deepctl --cov=deepctl_core --cov=deepctl_cmd_login --cov=deepctl_cmd_projects --cov=deepctl_cmd_transcribe --cov=deepctl_cmd_usage --cov=deepctl_shared_utils --cov-report=term-missing --cov-report=html --cov-config=pytest.ini -v
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    requires_auth: Tests that require authentication
    requires_network: Tests that require network access
    parametrize: Parametrized tests
    benchmark: Performance benchmark tests
    
# Test output
console_output_style = progress

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S 

[tool:pytest]
testpaths = tests/
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
# Increased verbosity for better test output
# Coverage for main package and individual command packages
# Add plugins for enhanced testing functionality
# addopts = --cov=deepgram_cli --cov=deepgram_core --cov=deepgram_cmd_login --cov=deepgram_cmd_projects --cov=deepgram_cmd_transcribe --cov=deepgram_cmd_usage --cov=deepgram_shared_utils --cov-report=term-missing --cov
addopts = --cov=deepctl --cov=deepctl_core --cov=deepctl_cmd_login --cov=deepctl_cmd_projects --cov=deepctl_cmd_transcribe --cov=deepctl_cmd_usage --cov=deepctl_shared_utils --cov-report=term-missing --cov-report=html --cov-config=pytest.ini -v

[coverage:paths]
source = src/deepctl
         packages/deepgram-core/src/deepgram_core
         packages/deepgram-cmd-login/src/deepgram_cmd_login
         packages/deepgram-cmd-projects/src/deepgram_cmd_projects
         packages/deepgram-cmd-transcribe/src/deepgram_cmd_transcribe
         packages/deepgram-cmd-usage/src/deepgram_cmd_usage
         packages/deepgram-shared-utils/src/deepgram_shared_utils
omit = */tests/*
       */test_*
       */__pycache__/*
       */venv/*
       */.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
    except ImportError:

[coverage:html]
directory = htmlcov

[tool:coverage]
# This is needed for some coverage tools
source = . 