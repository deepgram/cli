[build]
  base    = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SITE_URL     = "https://deepgram-cli.netlify.app"

# Netlify's own CI is disabled (stop_builds = true).
# All deploys are driven by GitHub Actions:
#   staging   → merge to main         → --alias staging
#   production → GitHub release v*    → --prod
